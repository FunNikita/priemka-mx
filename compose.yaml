name: ${COMPOSE_PROJECT_NAME:-priemka-mx}

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-${BOT_TOKEN}}
      MAX_BOT_NAME: ${MAX_BOT_NAME}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MAX_INIT_DATA_MAX_AGE_SECONDS: ${MAX_INIT_DATA_MAX_AGE_SECONDS:-3600}
      MAX_OUTBOUND_ENABLED: ${MAX_OUTBOUND_ENABLED:-true}
      ALLOW_SELF_ROLE_SWITCH: ${ALLOW_SELF_ROLE_SWITCH:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_AUTO_ENROLL_HOUSE_ADDRESS: ${DEMO_AUTO_ENROLL_HOUSE_ADDRESS:-}
      PREVIEW_ACCESS_REQUIRED: ${PREVIEW_ACCESS_REQUIRED:-false}
      BOT_TIME_ZONE: ${BOT_TIME_ZONE:-Europe/Moscow}
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
      APP_LOG_DIR: ${APP_LOG_DIR:-/app/data/logs}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      MEDIA_DIR: /app/data/media
      DOCUMENTS_DIR: /app/data/documents
    volumes:
      - media-data:/app/data/media
      - documents-data:/app/data/documents
      - logs-data:/app/data/logs
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  media-data:
  documents-data:
  logs-data:
