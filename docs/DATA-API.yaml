schemaVersion: '1.0'
solution:
  name: Приёмка
api:
  baseUrl: https://eval-priemka.ithube.ru
  openapi: ./openapi.json
  defaultHeaders:
    Accept: application/json
checks:
- id: ready
  name: Готовность EVAL
  method: GET
  path: /api/ready
  role: public
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: demo-house
  name: Найти демо-дом по адресу
  method: GET
  path: /api/houses
  role: RESIDENT
  request:
    query:
      q: 'Демо: ул. Примерная, д. 12'
      limit: 20
  extract:
    houseId: $.items[0].id
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: executor
  name: Найти активного исполнителя
  method: GET
  path: /api/houses/{houseId}/members
  role: CHAIRMAN
  dependsOn:
  - demo-house
  request:
    path:
      houseId: ${houseId}
    query:
      role: EXECUTOR
  extract:
    executorUserId: $.items[0].id
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: inspector
  name: Найти активного члена совета
  method: GET
  path: /api/houses/{houseId}/members
  role: CHAIRMAN
  dependsOn:
  - demo-house
  request:
    path:
      houseId: ${houseId}
    query:
      role: COUNCIL_MEMBER
  extract:
    inspectorUserId: $.items[0].id
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: template
  name: Найти шаблон проверки освещения
  method: GET
  path: /api/checklist-templates
  role: CHAIRMAN
  request:
    query:
      category: LIGHTING
  extract:
    checklistTemplateId: $.items[0].id
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: create-observation
  name: Создать новое обращение
  method: POST
  path: /api/houses/{houseId}/observations
  role: RESIDENT
  dependsOn:
  - demo-house
  request:
    path:
      houseId: ${houseId}
    body:
      category: LIGHTING
      title: 'API-проверка: приёмка работы'
      description: Синтетическое обращение для воспроизводимой проверки API
  extract:
    observationId: $.id
  repeatable: true
  expected:
    statusCodes:
    - 201
    contentType: application/json
- id: assign-executor
  name: Назначить исполнителя и создать Work
  method: PUT
  path: /api/observations/{observationId}/executor
  role: CHAIRMAN
  dependsOn:
  - create-observation
  - executor
  request:
    path:
      observationId: ${observationId}
    body:
      executorUserId: ${executorUserId}
  extract:
    workId: $.id
  repeatable: false
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: submit-work
  name: Передать Work на проверку
  method: POST
  path: /api/works/{workId}/submit-for-inspection
  role: EXECUTOR
  dependsOn:
  - assign-executor
  request:
    path:
      workId: ${workId}
    body: {}
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: assign-inspector
  name: Назначить одного проверяющего
  method: POST
  path: /api/works/{workId}/inspections
  role: CHAIRMAN
  dependsOn:
  - submit-work
  - inspector
  - template
  request:
    path:
      workId: ${workId}
    body:
      checklistTemplateId: ${checklistTemplateId}
      assigneeUserId: ${inspectorUserId}
  extract:
    assignmentId: $.id
  repeatable: false
  expected:
    statusCodes:
    - 201
    contentType: application/json
- id: inspection-detail
  name: Получить snapshot чек-листа
  method: GET
  path: /api/inspection-assignments/{assignmentId}
  role: COUNCIL_MEMBER
  dependsOn:
  - assign-inspector
  request:
    path:
      assignmentId: ${assignmentId}
  extract:
    itemId1: $.checklist[0].id
    itemId2: $.checklist[1].id
    itemId3: $.checklist[2].id
    itemId4: $.checklist[3].id
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: pass-item-1
  name: Ответить PASS на пункт 1
  method: PUT
  path: /api/inspection-assignments/{assignmentId}/answers/{itemId}
  role: COUNCIL_MEMBER
  dependsOn:
  - inspection-detail
  request:
    path:
      assignmentId: ${assignmentId}
      itemId: ${itemId1}
    body:
      result: PASS
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: pass-item-2
  name: Ответить PASS на пункт 2
  method: PUT
  path: /api/inspection-assignments/{assignmentId}/answers/{itemId}
  role: COUNCIL_MEMBER
  dependsOn:
  - inspection-detail
  request:
    path:
      assignmentId: ${assignmentId}
      itemId: ${itemId2}
    body:
      result: PASS
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: pass-item-3
  name: Ответить PASS на пункт 3
  method: PUT
  path: /api/inspection-assignments/{assignmentId}/answers/{itemId}
  role: COUNCIL_MEMBER
  dependsOn:
  - inspection-detail
  request:
    path:
      assignmentId: ${assignmentId}
      itemId: ${itemId3}
    body:
      result: PASS
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: pass-item-4
  name: Ответить PASS на пункт 4
  method: PUT
  path: /api/inspection-assignments/{assignmentId}/answers/{itemId}
  role: COUNCIL_MEMBER
  dependsOn:
  - inspection-detail
  request:
    path:
      assignmentId: ${assignmentId}
      itemId: ${itemId4}
    body:
      result: PASS
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: complete-inspection
  name: Завершить проверку без замечаний
  method: POST
  path: /api/inspection-assignments/{assignmentId}/complete
  role: COUNCIL_MEMBER
  dependsOn:
  - pass-item-1
  - pass-item-2
  - pass-item-3
  - pass-item-4
  request:
    path:
      assignmentId: ${assignmentId}
    body: {}
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: observation-with-act
  name: Получить созданный Acceptance Act
  method: GET
  path: /api/observations/{observationId}
  role: CHAIRMAN
  dependsOn:
  - complete-inspection
  request:
    path:
      observationId: ${observationId}
  extract:
    actId: $.workflow.documents[?(@.type=='ACCEPTANCE_ACT')].id
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: executor-confirm
  name: Исполнитель первым подтверждает акт
  method: POST
  path: /api/documents/{documentId}/confirm
  role: EXECUTOR
  dependsOn:
  - observation-with-act
  request:
    path:
      documentId: ${actId}
    body: {}
  repeatable: false
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: chairman-confirm
  name: Председатель вторым подтверждает акт
  method: POST
  path: /api/documents/{documentId}/confirm
  role: CHAIRMAN
  dependsOn:
  - executor-confirm
  request:
    path:
      documentId: ${actId}
    body: {}
  repeatable: false
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: accepted
  name: Проверить итоговый статус ACCEPTED
  method: GET
  path: /api/observations/{observationId}
  role: RESIDENT
  dependsOn:
  - chairman-confirm
  request:
    path:
      observationId: ${observationId}
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
    bodySchema:
      type: object
      properties:
        status:
          const: ACCEPTED
- id: create-fail-observation
  name: Создать отдельное обращение для проверки FAIL
  method: POST
  path: /api/houses/{houseId}/observations
  role: RESIDENT
  dependsOn:
  - accepted
  request:
    path:
      houseId: ${houseId}
    body:
      category: LIGHTING
      title: 'API-проверка: замечание по работе'
      description: Отдельная синтетическая проверка появления Issue
  extract:
    observationFailId: $.id
  repeatable: true
  expected:
    statusCodes:
    - 201
    contentType: application/json
- id: assign-fail-executor
  name: Назначить исполнителя по второму обращению
  method: PUT
  path: /api/observations/{observationId}/executor
  role: CHAIRMAN
  dependsOn:
  - create-fail-observation
  request:
    path:
      observationId: ${observationFailId}
    body:
      executorUserId: ${executorUserId}
  extract:
    workFailId: $.id
  repeatable: false
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: submit-fail-work
  name: Передать вторую работу на проверку
  method: POST
  path: /api/works/{workId}/submit-for-inspection
  role: EXECUTOR
  dependsOn:
  - assign-fail-executor
  request:
    path:
      workId: ${workFailId}
    body: {}
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: assign-fail-inspector
  name: Назначить проверяющего второй работы
  method: POST
  path: /api/works/{workId}/inspections
  role: CHAIRMAN
  dependsOn:
  - submit-fail-work
  request:
    path:
      workId: ${workFailId}
    body:
      checklistTemplateId: ${checklistTemplateId}
      assigneeUserId: ${inspectorUserId}
  extract:
    assignmentFailId: $.id
  repeatable: false
  expected:
    statusCodes:
    - 201
    contentType: application/json
- id: fail-inspection-detail
  name: Получить checklist второй проверки
  method: GET
  path: /api/inspection-assignments/{assignmentId}
  role: COUNCIL_MEMBER
  dependsOn:
  - assign-fail-inspector
  request:
    path:
      assignmentId: ${assignmentFailId}
  extract:
    failItemId1: $.checklist[0].id
    failItemId2: $.checklist[1].id
    failItemId3: $.checklist[2].id
    failItemId4: $.checklist[3].id
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: answer-fail-1
  name: Сохранить FAIL для пункта 1
  method: PUT
  path: /api/inspection-assignments/{assignmentId}/answers/{itemId}
  role: COUNCIL_MEMBER
  dependsOn:
  - fail-inspection-detail
  request:
    path:
      assignmentId: ${assignmentFailId}
      itemId: ${failItemId1}
    body:
      result: FAIL
      comment: 'Демо: светильник не включается'
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: answer-fail-2
  name: Сохранить PASS для пункта 2
  method: PUT
  path: /api/inspection-assignments/{assignmentId}/answers/{itemId}
  role: COUNCIL_MEMBER
  dependsOn:
  - fail-inspection-detail
  request:
    path:
      assignmentId: ${assignmentFailId}
      itemId: ${failItemId2}
    body:
      result: PASS
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: answer-fail-3
  name: Сохранить PASS для пункта 3
  method: PUT
  path: /api/inspection-assignments/{assignmentId}/answers/{itemId}
  role: COUNCIL_MEMBER
  dependsOn:
  - fail-inspection-detail
  request:
    path:
      assignmentId: ${assignmentFailId}
      itemId: ${failItemId3}
    body:
      result: PASS
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: answer-fail-4
  name: Сохранить PASS для пункта 4
  method: PUT
  path: /api/inspection-assignments/{assignmentId}/answers/{itemId}
  role: COUNCIL_MEMBER
  dependsOn:
  - fail-inspection-detail
  request:
    path:
      assignmentId: ${assignmentFailId}
      itemId: ${failItemId4}
    body:
      result: PASS
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: complete-fail-inspection
  name: Завершить проверку с замечанием
  method: POST
  path: /api/inspection-assignments/{assignmentId}/complete
  role: COUNCIL_MEMBER
  dependsOn:
  - answer-fail-1
  - answer-fail-2
  - answer-fail-3
  - answer-fail-4
  request:
    path:
      assignmentId: ${assignmentFailId}
    body: {}
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
- id: issue-created
  name: Получить созданный Issue
  method: GET
  path: /api/works/{workId}/issues
  role: EXECUTOR
  dependsOn:
  - complete-fail-inspection
  request:
    path:
      workId: ${workFailId}
  extract:
    issueId: $.items[0].id
  repeatable: true
  expected:
    statusCodes:
    - 200
    contentType: application/json
