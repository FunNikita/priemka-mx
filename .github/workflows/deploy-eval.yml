name: Deploy EVAL

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$COMMIT_SHA" =~ ^[[:xdigit:]]{40}$ ]] || { echo 'commit_sha must be exactly 40 hex characters' >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @priemka/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-eval:
    needs: verify
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: priemka-deploy-eval
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_DIR: /var/www/priemka/data/www/eval-priemka.ithube.ru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/priemka_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/priemka_deploy" "$HOME/.ssh/known_hosts"
      - name: Sync and deploy EVAL
        run: |
          ssh_args=(ssh -i "$HOME/.ssh/priemka_deploy" -p "$DEPLOY_SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$DEPLOY_DIR'"
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.eval-credentials' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='coverage/' \
            --exclude='review/' \
            --exclude='AGENTS.md' \
            --exclude='docs/DEPLOY.local.md' \
            --exclude='docs/EVAL-CREDENTIALS.local.md' \
            --exclude='.DS_Store' \
            -e "ssh -i $HOME/.ssh/priemka_deploy -p $DEPLOY_SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"
          "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && test -f .env && test -f compose.yaml && test -f scripts/deploy-compose.sh && bash scripts/deploy-compose.sh && docker compose exec -T api npm run demo:seed && curl -fsS http://127.0.0.1:\$(sed -nE 's/^APP_PORT=([0-9]+)$/\1/p' .env | tail -n 1)/api/ready >/dev/null"
          curl --fail --silent --show-error --max-time 10 https://eval-priemka.ithube.ru/api/ready > /dev/null
